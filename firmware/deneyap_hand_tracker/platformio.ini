; ============================================================================
; Deneyap Hand Tracker — Phase 1 firmware
; Board: Deneyap Kart v2 (ESP32-S3-WROOM-1-N8R8)
;
; PlatformIO has no native "Deneyap Kart v2" board definition yet, so we use
; the generic ESP32-S3 DevKitC-1 with the exact flags the official Deneyap
; Arduino core ships for this board (USB Mode = Hardware CDC and JTAG,
; CDC On Boot = Enabled, OPI PSRAM, 8 MB flash).
;
; Build + upload : pio run -t upload
; ============================================================================

[platformio]
src_dir = .

[env:deneyap_kart_v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600

board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Serial data is binary-framed: only use `pio device monitor` to watch the
; human-readable CALIB/RATE log frames; the pose frames will look like noise.
